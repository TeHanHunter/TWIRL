    bootstrap_replicates: 1000
    bootstrap_seed: 560305
    same_resamples_across_arms_and_paired_deltas: true
  bls_or_periodic_search: false

objective:
  name: masked_reconstruction_plus_position_centered_cadence_vicreg_v1
  first_mask:
    deterministic: true
    independent_of_second_mask: true
  second_mask:
    deterministic: true
    independent_of_first_mask: true
  reconstruction:
    definition: first_mask_reconstruction_only
    optimized_mask_views: [first]
    second_mask_reconstruction_is_diagnostic_only: true
    loss: huber
    huber_delta_fractional_flux: 0.01
    equal_view_weight: true
  vicreg:
    acts_on: position_centered_h_cadence
    valid_unmasked_same_position_pairs_only: true
    begins_at_optimizer_step: 1
    total_weight: 0.0002
    invariance_weight: 25.0
    variance_weight: 25.0
    covariance_weight: 1.0
    pooled_window_input_forbidden: true

optimization:
  seeds: [560067]
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  scheduler: cosine_with_linear_warmup
  max_optimizer_steps: 20000
  scheduler_horizon_steps: 20000
  warmup_steps: 1000
  effective_batch_windows: 64
  effective_batch_unique_windows: 64
  numerical_precision: bf16_after_fp32_smoke

