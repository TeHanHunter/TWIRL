schema_version: twirl_teacher_v3_training_config_v1
run_name: teacher_v3
run_id: teacher_v3_s56_s62_a2v1_current_adp
architecture_version: s56_harmonic_cnn_v1
checkpoint_namespace: twirl_teacher_v3_s56_s62_native_v1

scope:
  sectors: [56, 57, 58, 59, 60, 61, 62]
  prospective_sector_63_reserved: true
  student_training_blocked: true
  automatic_production_promotion: false

inputs:
  corpus: reports/stage5_validation/teacher_v3_s56_s62_a2v1_current_adp/frozen/observation_morphology_corpus.csv
  corpus_summary: reports/stage5_validation/teacher_v3_s56_s62_a2v1_current_adp/frozen/observation_morphology_corpus.summary.json
  tic_split_registry: reports/stage5_validation/teacher_v3_s56_s62_a2v1_current_adp/frozen/tic_split_registry.csv
  tic_split_summary: reports/stage5_validation/teacher_v3_s56_s62_a2v1_current_adp/frozen/tic_split_registry.summary.json
  split_bound_training_table: reports/stage5_validation/teacher_v3_s56_s62_a2v1_current_adp/native_preparation/training_table_with_splits.csv
  real_native_registry: reports/stage5_validation/teacher_v3_s56_s62_a2v1_current_adp/native/native_input_registry.csv
  real_native_registry_summary: reports/stage5_validation/teacher_v3_s56_s62_a2v1_current_adp/native/native_input_registry.summary.json
  injection_native_mapping: reports/stage5_validation/teacher_v3_s56_s62_a2v1_current_adp/native_preparation/injection_native_mapping.csv

split:
  group_column: tic
  seed: 560062
  fixed_test_tic_fraction: 0.20
  development_folds: 5
  identity_columns: [sector, tic, teacher_v3_observation_id]

native_inputs:
  contract_version: s56_adp_raw_pair_v2
  require_external_quality_overlay: true
  require_periodograms: true
  periodogram_samples: 4096
  apertures: [DET_FLUX_ADP_SML, DET_FLUX_ADP]
  period_views: [P/4, P/3, P/2, P, 2P, 3P, 4P]

model:
  primary_profile: shape_plus_periodogram_bls
  baseline_profile: metadata_only
  profile_selection_from_test_forbidden: true
  morphology_classes:
    [planet_like, eclipse_contact, smooth_variable, other]
  preserve_classes: [reject, preserve]
  harmonic_supervision: verified_s56_only
  reported_period_factors_are_audit_only: true

optimization:
  epochs: 100
  encoder_pretrain_epochs: 20
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 12
  seed: 560062

evaluation:
  calibration: one_temperature_from_concatenated_development_oof_logits
  test_opened_once_after_model_and_threshold_freeze: true
  source_separated_metrics: [real, injected]
  bootstrap:
    unit: tic
    draws: 2000
    seed: 560063
    confidence_level: 0.95
  sensitivities:
    - uncertain_as_other
    - uncertain_masked
  report_metrics:
    - macro_f1
    - balanced_accuracy
    - planet_recall
    - eb_recall
    - variable_recall
    - other_recall
    - expected_calibration_error

compute:
  system: orcd
  partition: pg_mki_aryeh
  h200_gpus: 1
  max_h200_gpus: 1
