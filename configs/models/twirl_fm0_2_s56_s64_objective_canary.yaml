  sector_camera_ccd_model_visible: false
  bls_labels_candidates_injections_model_visible: false
  learned_host_aggregator: false
  cross_sector_consistency_loss: false
  dedicated_ssl_projector: false

objective:
  name: masked_reconstruction_plus_same_window_vicreg
  first_mask:
    deterministic: true
    independent_of_second_mask: true
  second_mask:
    deterministic: true
    independent_of_first_mask: true
  reconstruction:
    definition: first_mask_reconstruction_only
    optimized_mask_views: [first]
    second_mask_reconstruction_is_diagnostic_only: true
    loss: huber
    huber_delta_fractional_flux: 0.01
    equal_view_weight: true
  vicreg:
    acts_on: z_window
    begins_at_optimizer_step: 1
    total_weight: 0.0002
    invariance_weight: 25.0
    variance_weight: 25.0
    covariance_weight: 1.0
    hidden_weight_sweep_forbidden: true
    scale_rationale: >-
      At a collapsed initialization the weighted variance component is about
      24.75. Multiplying by 0.0002 contributes about 0.00495, comparable to the
      observed 0.0047 reconstruction loss instead of roughly 500 times larger.
  total: >-
    Huber(mask_A) +
    0.0002 * (25 * invariance + 25 * variance + 1 * covariance)

